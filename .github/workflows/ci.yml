name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # --------------------------------------------------------------------------
  # 1. Format & Lint
  # --------------------------------------------------------------------------
  lint:
    name: Lint & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & index
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Clippy checks (all targets)
        run: cargo clippy --workspace --all-targets -- -D clippy::correctness

      - name: Forbid unsafe code verification
        run: |
          echo "Verifying #![forbid(unsafe_code)] in all crates..."
          for crate in crates/*; do
            if [ -d "$crate/src" ]; then
              if [ -f "$crate/src/lib.rs" ]; then
                grep -q "#!\[forbid(unsafe_code)\]" "$crate/src/lib.rs" || { echo "Missing #![forbid(unsafe_code)] in $crate/src/lib.rs"; exit 1; }
              fi
              if [ -f "$crate/src/main.rs" ]; then
                grep -q "#!\[forbid(unsafe_code)\]" "$crate/src/main.rs" || { echo "Missing #![forbid(unsafe_code)] in $crate/src/main.rs"; exit 1; }
              fi
            fi
          done
          echo "All crates strictly forbid unsafe code!"

  # --------------------------------------------------------------------------
  # 2. Test Suite (Linux & macOS)
  # --------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & index
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run unit & integration tests
        run: |
          set -o pipefail
          cargo test --workspace -- --nocapture 2>&1 | tee test_output.log
        shell: bash

      - name: Report test failure details
        if: failure()
        run: |
          echo "## Test Failure Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -B 10 -A 60 "failures:" test_output.log >> $GITHUB_STEP_SUMMARY || tail -n 120 test_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          FAIL_LINES=$(grep -A 30 "^failures:" test_output.log || tail -n 30 test_output.log)
          FAIL_ESCAPED="${FAIL_LINES//$'\n'/%0A}"
          FAIL_ESCAPED="${FAIL_ESCAPED//$'\r'/%0D}"
          echo "::error title=Cargo Test Failures::$FAIL_ESCAPED"
        shell: bash

      - name: Publish failure log to debug branch
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-debug-${{ matrix.os }}
          git reset
          git add test_output.log -f
          git commit -m "ci: ${{ matrix.os }} test failure log [skip ci]" || true
          git push -f origin ci-debug-${{ matrix.os }} || true
        shell: bash

      - name: Run Milestone 10 performance tests
        run: cargo test -p velcrux-core --test m10_performance -- --nocapture

  # --------------------------------------------------------------------------
  # 3. Definition of Done (DoD §83) Validation Suite
  # --------------------------------------------------------------------------
  definition-of-done:
    name: Definition of Done (§83)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Execute 15-Item Definition of Done Harness
        run: bash scripts/validate_dod.sh

  # --------------------------------------------------------------------------
  # 4. Container Build & Packaging Verification
  # --------------------------------------------------------------------------
  docker:
    name: Container Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: velcruxd:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
