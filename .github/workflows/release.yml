name: Release & Packaging Pipeline

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.0)"
        required: false
        default: "v0.1.0"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # --------------------------------------------------------------------------
  # 1. Multi-Platform Binary & Package Compilation
  # --------------------------------------------------------------------------
  build-release:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux GNU Targets
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-amd64
            archive: tar.gz
            deb_arch: amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-arm64
            archive: tar.gz
            use_cross: true
            deb_arch: arm64
          # Linux MUSL Static Targets
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-musl-amd64
            archive: tar.gz
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-musl-arm64
            archive: tar.gz
            use_cross: true
          # macOS Targets (Apple Silicon & Intel)
          - target: aarch64-apple-darwin
            os: macos-latest
            name: darwin-arm64
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            name: darwin-amd64
            archive: tar.gz
          # Windows Target
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: windows-amd64
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${TAG}" != v* ]]; then
            TAG="${{ github.event.inputs.tag_name || 'v0.1.0' }}"
          fi
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          CLEAN_VERSION="${TAG#v}"
          echo "CLEAN_VERSION=${CLEAN_VERSION}" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (if cross-compiling)
        if: matrix.use_cross
        uses: taiki-e/install-action@cross

      - name: Build release binaries (cross)
        if: matrix.use_cross
        run: |
          cross build --release --target ${{ matrix.target }} -p velcrux-client -p velcrux-server

      - name: Build release binaries (native / cargo)
        if: "!matrix.use_cross"
        run: |
          cargo build --release --target ${{ matrix.target }} -p velcrux-client -p velcrux-server

      # Shell completions generation
      - name: Generate shell completions (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p completions
          BIN="target/${{ matrix.target }}/release/velcrux"
          SERVER_BIN="target/${{ matrix.target }}/release/velcruxd"
          chmod +x "$BIN" "$SERVER_BIN" 2>/dev/null || true
          if "$BIN" --version &>/dev/null; then
            "$BIN" completions bash > completions/velcrux.bash
            "$BIN" completions zsh > completions/_velcrux
            "$BIN" completions fish > completions/velcrux.fish
            "$BIN" completions powershell > completions/velcrux.ps1
            "$SERVER_BIN" completions bash > completions/velcruxd.bash
            "$SERVER_BIN" completions zsh > completions/_velcruxd
            "$SERVER_BIN" completions fish > completions/velcruxd.fish
            "$SERVER_BIN" completions powershell > completions/velcruxd.ps1
          else
            cargo run -p velcrux-client -- completions bash > completions/velcrux.bash
            cargo run -p velcrux-client -- completions zsh > completions/_velcrux
            cargo run -p velcrux-client -- completions fish > completions/velcrux.fish
            cargo run -p velcrux-client -- completions powershell > completions/velcrux.ps1
            cargo run -p velcrux-server -- completions bash > completions/velcruxd.bash
            cargo run -p velcrux-server -- completions zsh > completions/_velcruxd
            cargo run -p velcrux-server -- completions fish > completions/velcruxd.fish
            cargo run -p velcrux-server -- completions powershell > completions/velcruxd.ps1
          fi

      - name: Generate shell completions (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path completions | Out-Null
          $bin = "target/${{ matrix.target }}/release/velcrux.exe"
          $server_bin = "target/${{ matrix.target }}/release/velcruxd.exe"
          & $bin completions bash | Out-File -Encoding utf8 completions/velcrux.bash
          & $bin completions zsh | Out-File -Encoding utf8 completions/_velcrux
          & $bin completions fish | Out-File -Encoding utf8 completions/velcrux.fish
          & $bin completions powershell | Out-File -Encoding utf8 completions/velcrux.ps1
          & $server_bin completions bash | Out-File -Encoding utf8 completions/velcruxd.bash
          & $server_bin completions zsh | Out-File -Encoding utf8 completions/_velcruxd
          & $server_bin completions fish | Out-File -Encoding utf8 completions/velcruxd.fish
          & $server_bin completions powershell | Out-File -Encoding utf8 completions/velcruxd.ps1

      # Debian .deb packaging on Linux GNU targets
      - name: Build Debian (.deb) package
        if: matrix.deb_arch != ''
        shell: bash
        run: |
          mkdir -p deb-dist
          bash packaging/build-deb.sh "${{ matrix.deb_arch }}" "${CLEAN_VERSION}" "target/${{ matrix.target }}/release" "deb-dist"
          if command -v sha256sum &>/dev/null; then
            cd deb-dist && sha256sum *.deb > "${{ matrix.name }}-deb.sha256" || true
          fi

      # Package release archive (Unix)
      - name: Package release archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          STAGE="velcrux-${RELEASE_TAG}-${{ matrix.name }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/velcrux" "$STAGE/"
          cp "target/${{ matrix.target }}/release/velcruxd" "$STAGE/"
          cp -r completions "$STAGE/"
          cp README.md LICENSE-APACHE LICENSE-MIT "$STAGE/" 2>/dev/null || true
          ARCHIVE_NAME="velcrux-${RELEASE_TAG}-${{ matrix.name }}.tar.gz"
          tar -czf "$ARCHIVE_NAME" "$STAGE"

          # Compute SHA-256
          if command -v sha256sum &>/dev/null; then
            sha256sum "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          else
            shasum -a 256 "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          fi

          echo "ARCHIVE_PATH=${ARCHIVE_NAME}" >> $GITHUB_ENV
          echo "SHA_PATH=${ARCHIVE_NAME}.sha256" >> $GITHUB_ENV

      # Package release archive (Windows)
      - name: Package release archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "velcrux-${env:RELEASE_TAG}-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/velcrux.exe" -Destination "$stage/"
          Copy-Item "target/${{ matrix.target }}/release/velcruxd.exe" -Destination "$stage/"
          Copy-Item -Recurse "completions" -Destination "$stage/"
          if (Test-Path "README.md") { Copy-Item "README.md" -Destination "$stage/" }
          if (Test-Path "LICENSE-APACHE") { Copy-Item "LICENSE-APACHE" -Destination "$stage/" }
          if (Test-Path "LICENSE-MIT") { Copy-Item "LICENSE-MIT" -Destination "$stage/" }
          $archiveName = "velcrux-${env:RELEASE_TAG}-${{ matrix.name }}.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $archiveName
          $hash = (Get-FileHash -Algorithm SHA256 $archiveName).Hash.ToLower()
          "$hash  $archiveName" | Out-File -Encoding ascii "${archiveName}.sha256"
          echo "ARCHIVE_PATH=${archiveName}" >> $env:GITHUB_ENV
          echo "SHA_PATH=${archiveName}.sha256" >> $env:GITHUB_ENV

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            ${{ env.ARCHIVE_PATH }}
            ${{ env.SHA_PATH }}
            deb-dist/*.deb
            deb-dist/*.sha256
          retention-days: 5

  # --------------------------------------------------------------------------
  # 2. Multi-Architecture Container Image (GHCR)
  # --------------------------------------------------------------------------
  docker-release:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${TAG}" != v* ]]; then
            TAG="${{ github.event.inputs.tag_name || 'v0.1.0' }}"
          fi
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.RELEASE_TAG }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------------------------------
  # 3. Publish GitHub Release with Attestations & Manifests
  # --------------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    needs: [build-release, docker-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Aggregate Release Assets & Generate Checksums
        shell: bash
        run: |
          mkdir -p dist
          find release-artifacts -type f -name "*.tar.gz" -exec cp {} dist/ \;
          find release-artifacts -type f -name "*.zip" -exec cp {} dist/ \;
          find release-artifacts -type f -name "*.deb" -exec cp {} dist/ \;
          
          # Aggregate SHA-256 sums
          find release-artifacts -type f -name "*.sha256" -exec cat {} + | sort -k2 | uniq > dist/SHA256SUMS.txt
          echo "Generated SHA256SUMS.txt:"
          cat dist/SHA256SUMS.txt

          # Generate BLAKE3 sums (first-class hash) using cargo-b3sum or client binary
          cargo run -p velcrux-client -- completions bash > /dev/null 2>&1 || true
          if command -v b3sum >/dev/null 2>&1; then
            cd dist && b3sum *.tar.gz *.zip *.deb 2>/dev/null > BLAKE3SUMS.txt || true
          fi

          # Generate Homebrew formula artifact
          cargo run -p velcrux-client -- package homebrew --output dist/velcrux.rb || cp packaging/homebrew/velcrux.rb dist/velcrux.rb

          # Package Helm chart archive (.tgz)
          mkdir -p dist/helm
          tar -czf dist/velcrux-helm-0.1.0.tgz -C packaging/helm velcrux

      - name: Determine tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${TAG}" != v* ]]; then
            TAG="${{ github.event.inputs.tag_name || 'v0.1.0' }}"
          fi
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Velcrux ${{ env.RELEASE_TAG }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*
            dist/helm/*
