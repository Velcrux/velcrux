[workspace]
resolver = "2"
members = [
    "crates/velcrux-core",
    "crates/velcrux-client",
    "crates/velcrux-server",
]

[workspace.package]
version     = "0.1.0"
edition     = "2021"
rust-version = "1.75"
license     = "Apache-2.0 OR MIT"
repository  = "https://example.invalid/velcrux"

# Pin the versions that compile together on the current stable toolchain.
# Quinn 0.10 was built against the rustls 0.22 (rustls::Certificate /
# rustls::PrivateKey) API; we keep that pairing for the MVP.
[workspace.dependencies]
tokio            = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs"] }
quinn            = { version = "0.10", features = ["rustls", "log", "runtime-tokio"] }
rustls           = { version = "0.21", default-features = false, features = ["quic"] }
rustls-pemfile   = "1"
rcgen            = { version = "0.13", default-features = false, features = ["pem", "ring", "x509-parser"] }
thiserror        = "1.0"
anyhow           = "1.0"
bytes            = "1.7"
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
clap             = { version = "4.5", features = ["derive", "env"] }
ulid             = "1.1"
rand             = "0.8"
serde            = { version = "1.0", features = ["derive"] }
serde_json       = "1.0"
toml             = "0.8"
url              = "2.5"

[profile.release]
opt-level = 3
lto       = "thin"
codegen-units = 1
strip     = "symbols"
