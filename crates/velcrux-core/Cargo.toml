[package]
name        = "velcrux-core"
version.workspace     = true
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
repository.workspace  = true
description = "Core library for velcrux: protocol, transport (QUIC), session state, types."

[lib]
# Pure-Rust, no C dependencies. `forbid(unsafe_code)` is in lib.rs.
path = "src/lib.rs"

[dependencies]
tokio.workspace      = true
quinn.workspace      = true
rustls.workspace     = true
rustls-pemfile.workspace = true
sha2                 = "0.10"
async-trait          = "0.1"
# mTLS identity extraction (SAN URI / CN) from the verified peer certificate
# chain — SECURITY.md §2. Version pinned to the already-locked 0.16.0, which
# is present transitively via rcgen (see Cargo.lock).
x509-parser          = "0.16"
thiserror.workspace  = true
anyhow.workspace     = true
bytes.workspace      = true
blake3.workspace     = true
tracing.workspace    = true
ulid.workspace       = true
rand.workspace       = true
rusqlite.workspace   = true
serde.workspace      = true
toml.workspace       = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
rcgen.workspace = true
rustls-pemfile.workspace = true
tracing-subscriber.workspace = true
rustls.workspace = true
tempfile         = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# We want a clean build. Add targeted allows as needed; the default is to fail.
all = { level = "warn", priority = -1 }
