apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: velcruxclusters.velcrux.io
spec:
  group: velcrux.io
  names:
    kind: VelcruxCluster
    listKind: VelcruxClusterList
    plural: velcruxclusters
    singular: velcruxcluster
    shortNames:
      - vxcluster
      - vxc
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - storageBackend
              properties:
                replicas:
                  type: integer
                  minimum: 1
                  default: 3
                storageBackend:
                  type: string
                  enum: [local, memory, s3]
                  default: local
                storageCapacity:
                  type: string
                  default: 1Ti
                quicPort:
                  type: integer
                  minimum: 1024
                  maximum: 65535
                  default: 7443
                metricsPort:
                  type: integer
                  minimum: 1024
                  maximum: 65535
                  default: 9443
                raftPort:
                  type: integer
                  minimum: 1024
                  maximum: 65535
                  default: 9444
                mtlsSecretName:
                  type: string
                deletionPolicy:
                  type: string
                  enum: [admin_only, explicit_grant, disabled]
                  default: admin_only
            status:
              type: object
              properties:
                phase:
                  type: string
                readyReplicas:
                  type: integer
                currentLeader:
                  type: string
                activeRaftEpoch:
                  type: integer
                endpoints:
                  type: array
                  items:
                    type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas
        - name: Leader
          type: string
          jsonPath: .status.currentLeader
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
