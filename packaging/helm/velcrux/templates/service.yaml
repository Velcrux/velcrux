apiVersion: v1
kind: Service
metadata:
  name: {{ include "velcrux.fullname" . }}
  labels:
    {{- include "velcrux.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if and (eq .Values.service.type "LoadBalancer") .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP }}
  {{- end }}
  ports:
    - name: quic
      port: {{ .Values.service.quicPort }}
      targetPort: quic
      protocol: UDP
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "velcrux.selectorLabels" . | nindent 4 }}

