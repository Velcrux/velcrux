apiVersion: velcrux.io/v1alpha1
kind: VelcruxTransfer
metadata:
  name: nightly-ai-weights-sync
  namespace: default
spec:
  sourceUrl: "velcrux://primary-storage.velcrux.svc.cluster.local:7443/datasets/llama-weights"
  destinationPath: "/mnt/models/llama-weights"
  schedule: "0 2 * * *" # Daily at 02:00 UTC
  priority: urgent
  concurrency: 8
  bdpTuning: auto
  maxBdpWindow: 536870912
  compression: zstd
  dedup: true
  tenantId: ai-research-lab
  secretRef: velcrux-client-mtls
  retryPolicy:
    maxRetries: 5
    initialBackoffSecs: 10
    maxBackoffSecs: 300

