apiVersion: v1
kind: Service
metadata:
  name: velcruxd
  labels:
    app.kubernetes.io/name: velcruxd
spec:
  type: LoadBalancer
  ports:
    - name: quic
      port: 7443
      protocol: UDP
      targetPort: 7443
    - name: metrics
      port: 9443
      protocol: TCP
      targetPort: 9443
  selector:
    app.kubernetes.io/name: velcruxd
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: velcruxd
  labels:
    app.kubernetes.io/name: velcruxd
spec:
  serviceName: velcruxd
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: velcruxd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: velcruxd
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: velcruxd
          image: ghcr.io/velcrux/velcrux:v0.1.0
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/velcruxd
            - run
            - --config
            - /etc/velcrux/server.toml
          ports:
            - name: quic
              containerPort: 7443
              protocol: UDP
            - name: metrics
              containerPort: 9443
              protocol: TCP
          envFrom:
            - configMapRef:
                name: velcrux-config
                optional: true
            - secretRef:
                name: velcrux-secrets
                optional: true
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "8000m"
              memory: "8Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9443
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9443
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: storage
              mountPath: /data/velcrux
            - name: state
              mountPath: /var/lib/velcrux
            - name: config
              mountPath: /etc/velcrux
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: velcrux-server-config
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Ti
    - metadata:
        name: state
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 50Gi
